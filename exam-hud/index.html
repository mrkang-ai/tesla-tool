<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang-ko="수능·공시 시험장 멘탈 훈련 HUD - TeslaTool" data-lang-en="Exam Ambience & Mental HUD - TeslaTool">수능·공시 시험장 멘탈 훈련 HUD - TeslaTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' } } } }
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <div id="header-placeholder"></div>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    <div class="mb-6 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 text-blue-400 text-xs font-semibold uppercase tracking-wider mb-2 border border-blue-500/20">
          <i class="fa-solid fa-headphones"></i> CAT-03 / No.30
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold" data-lang-ko="🎧 수능·공시 실전 멘탈 훈련 백색소음 HUD" data-lang-en="🎧 Exam Ambience & Mental Trainer HUD">🎧 수능·공시 실전 멘탈 훈련 백색소음 HUD</h1>
        <p class="text-slate-400 text-sm mt-1" data-lang-ko="OMR 마킹 타이머와 함께 시험장 실전 소음(시험지 넘기는 소리, 시계 초침) 멘탈 강화" data-lang-en="Simulate authentic test hall ambience with ticking clocks, paper turns, and strict OMR timers">
          OMR 마킹 타이머와 함께 시험장 실전 소음(시험지 넘기는 소리, 시계 초침) 멘탈 강화
        </p>
      </div>
      <div>
        <button id="soundToggleBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl transition flex items-center gap-2">
          <i class="fa-solid fa-volume-high"></i> 실전 소음 재생 ON
        </button>
      </div>
    </div>

    <!-- Timer HUD -->
    <div class="bg-slate-800/80 rounded-2xl p-6 sm:p-8 border border-slate-700 text-center space-y-6 shadow-2xl">
      <div class="flex justify-center items-center gap-2 text-xs font-mono text-slate-400">
        <i class="fa-solid fa-stopwatch text-blue-400"></i>
        <span>실전 시험 남은 시간</span>
      </div>

      <div id="timerDisplay" class="text-6xl sm:text-7xl font-mono font-black text-blue-400">
        50:00
      </div>

      <div class="flex justify-center gap-2">
        <button class="t-btn px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs text-slate-300" data-min="80">국어 (80분)</button>
        <button class="t-btn px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs text-slate-300" data-min="100">수학 (100분)</button>
        <button class="t-btn px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs text-slate-300" data-min="50">영어 (50분)</button>
        <button class="t-btn px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs text-slate-300" data-min="30">탐구 (30분)</button>
      </div>
    </div>

    <!-- Noise toggles -->
    <div class="mt-6 bg-slate-800/80 rounded-xl p-5 border border-slate-700 space-y-3">
      <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">시험장 빌런 소음 옵션</h3>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
        <label class="flex items-center gap-2 p-2.5 rounded bg-slate-900 border border-slate-700 cursor-pointer">
          <input type="checkbox" id="noiseTicking" checked class="rounded text-blue-500 bg-slate-800 border-slate-600">
          <span>째깍째깍 초침 소리</span>
        </label>
        <label class="flex items-center gap-2 p-2.5 rounded bg-slate-900 border border-slate-700 cursor-pointer">
          <input type="checkbox" id="noisePages" checked class="rounded text-blue-500 bg-slate-800 border-slate-600">
          <span>시험지 촤라락 넘김</span>
        </label>
        <label class="flex items-center gap-2 p-2.5 rounded bg-slate-900 border border-slate-700 cursor-pointer">
          <input type="checkbox" id="noiseCough" class="rounded text-blue-500 bg-slate-800 border-slate-600">
          <span>옆자리 헛기침</span>
        </label>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="hud.js"></script>
</body>
</html>
