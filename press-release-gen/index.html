<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang-ko="공식 보도자료 생성기 - TeslaTool" data-lang-en="Official Press Release Generator - TeslaTool">공식 보도자료 생성기 - TeslaTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' } } } }
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <div id="header-placeholder"></div>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    <div class="mb-6 flex flex-wrap items-center justify-between gap-4 border-b border-slate-700 pb-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 text-blue-400 text-xs font-semibold uppercase tracking-wider mb-2 border border-blue-500/20">
          <i class="fa-solid fa-newspaper"></i> CAT-02 / No.14
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold" data-lang-ko="📰 공공기관 공식 보도자료 생성기" data-lang-en="📰 Official Press Release Generator">📰 공공기관 공식 보도자료 생성기</h1>
        <p class="text-slate-400 text-sm mt-1" data-lang-ko="거창한 수식어와 엠바고, 3단 개조식(배경·골자·기대효과)으로 완성하는 100% 공공기관 표준 보도자료" data-lang-en="Generate flawless government-style press releases with grand rhetoric, embargo headers, and 3-tier bullet points">
          거창한 수식어와 엠바고, 3단 개조식(배경·골자·기대효과)으로 완성하는 100% 공공기관 표준 보도자료
        </p>
      </div>
      <div class="flex items-center gap-2">
        <button id="sampleBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 border border-slate-700 transition">
          <i class="fa-solid fa-wand-magic-sparkles text-amber-400 mr-1"></i> 예시 불러오기
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- Input Panel -->
      <div class="lg:col-span-5 bg-slate-800/80 backdrop-blur rounded-xl p-5 border border-slate-700 space-y-4">
        <h2 class="text-sm font-bold text-blue-400 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-sliders"></i> 보도자료 기본 정보
        </h2>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">배포 일시 및 엠바고</label>
          <div class="grid grid-cols-2 gap-2">
            <select id="embargoType" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none">
              <option value="즉시">즉시 배포 가능</option>
              <option value="조간">석간/조간 엠바고</option>
              <option value="지정">지정 일시 엠바고</option>
            </select>
            <input type="text" id="deptName" value="디지털혁신추진단 스마트행정팀" placeholder="담당 부서명" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">핵심 사업/정책명</label>
          <input type="text" id="projectName" value="AI 기반 대민 원스톱 민원 스마트 고도화 사업" placeholder="예: 구내식당 메뉴 자율개선제" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">주요 수식어 톤앤매너</label>
          <select id="toneStyle" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none">
            <option value="grand">초대형 혁신형 (선도적, 패러다임 전환, 도약의 발판)</option>
            <option value="warm">체감·상생형 (국민 눈높이, 든든한 동반자, 온기 확산)</option>
            <option value="emergency">비상 대응·안전형 (총력 대응, 촘촘한 안전망, 무관용 원칙)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">핵심 골자 3가지 (줄바꿈 구분)</label>
          <textarea id="keyPoints" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none" placeholder="1. 민원 처리 시간 50% 감축&#10;2. 모바일 원클릭 서류 발급 체계 신설&#10;3. 전담 지원 헬프데스크 상시 가동"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">담당자/문의처</label>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="contactPerson" value="홍길동 사무관" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs">
            <input type="text" id="contactTel" value="02-1234-5678" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs">
          </div>
        </div>

        <button id="generateBtn" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg text-sm transition shadow-lg shadow-blue-500/25 flex items-center justify-center gap-2">
          <i class="fa-solid fa-file-pen"></i> 보도자료 완성하기
        </button>
      </div>

      <!-- Preview Panel (Gov Style Document) -->
      <div class="lg:col-span-7 bg-white text-slate-900 rounded-xl p-6 sm:p-8 shadow-2xl border border-slate-300 relative flex flex-col font-serif">
        <div class="flex justify-between items-center border-b-2 border-slate-900 pb-3 mb-4">
          <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded bg-blue-900 text-white flex items-center justify-center font-bold font-sans text-xs">
              보도
            </div>
            <div>
              <span class="text-xs font-sans font-bold text-blue-900 block" id="docBadge">배포 즉시 보도 가능</span>
              <span class="text-[11px] font-sans text-slate-500" id="docDate">2026. 09. 12.</span>
            </div>
          </div>
          <div class="text-right font-sans text-xs text-slate-600">
            <div class="font-bold text-slate-900" id="docDept">스마트행정팀</div>
            <div>담당: <span id="docOfficer">홍길동 사무관</span> (<span id="docPhone">02-1234-5678</span>)</div>
          </div>
        </div>

        <div id="outputContent" class="flex-1 space-y-4 text-sm leading-relaxed overflow-y-auto max-h-[550px] pr-2">
          <!-- Dynamic generated content -->
        </div>

        <div class="mt-6 pt-4 border-t border-slate-300 flex items-center justify-between font-sans">
          <span class="text-xs text-slate-400">공공누리 제1유형 출처표시 조건</span>
          <div class="flex gap-2">
            <button id="copyBtn" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-lg transition flex items-center gap-1.5">
              <i class="fa-regular fa-copy"></i> 전체 복사
            </button>
            <button id="printBtn" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded-lg transition">
              <i class="fa-solid fa-print"></i> 인쇄
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="press.js"></script>
</body>
</html>
