<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang-ko="공공 의전 서열 좌석 배치도 - TeslaTool" data-lang-en="Official Protocol Seating Simulator - TeslaTool">공공 의전 서열 좌석 배치도 - TeslaTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#8b5cf6' } } } }
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <div id="header-placeholder"></div>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    <div class="mb-6 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-500/10 text-purple-400 text-xs font-semibold uppercase tracking-wider mb-2 border border-purple-500/20">
          <i class="fa-solid fa-chair"></i> CAT-02 / No.18
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold" data-lang-ko="🎖️ 공공 의전 서열 좌석 배치도 시뮬레이터" data-lang-en="🎖️ Protocol Seating Arrangement Simulator">🎖️ 공공 의전 서열 좌석 배치도 시뮬레이터</h1>
        <p class="text-slate-400 text-sm mt-1" data-lang-ko="차량 1호차 탑승 위치, 회의실 헤드테이블, 단상 기념촬영 상석 원칙(중앙 우측 우선) 시각화 다이어그램" data-lang-en="Visual simulator for VIP sedan seats, conference head tables, and photo stages following protocol rules">
          차량 1호차 탑승 위치, 회의실 헤드테이블, 단상 기념촬영 상석 원칙(중앙 우측 우선) 시각화 다이어그램
        </p>
      </div>
      <div class="flex items-center gap-2">
        <button id="exportSvgBtn" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-white text-xs rounded-lg transition font-medium">
          <i class="fa-solid fa-download mr-1"></i> 배치도 이미지 저장
        </button>
      </div>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="flex flex-wrap gap-2 mb-6">
      <button class="scene-tab px-4 py-2 rounded-xl text-xs font-bold border border-slate-700 transition flex items-center gap-2 bg-purple-600 text-white border-purple-500" data-scene="car">
        <i class="fa-solid fa-car-side"></i> 1호차 관용차 탑승 (세단)
      </button>
      <button class="scene-tab px-4 py-2 rounded-xl text-xs font-bold border border-slate-700 transition flex items-center gap-2 bg-slate-800 text-slate-400 hover:text-white" data-scene="table">
        <i class="fa-solid fa-users-rectangle"></i> 회의실 헤드테이블
      </button>
      <button class="scene-tab px-4 py-2 rounded-xl text-xs font-bold border border-slate-700 transition flex items-center gap-2 bg-slate-800 text-slate-400 hover:text-white" data-scene="photo">
        <i class="fa-solid fa-camera"></i> 기념촬영 단상
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- Input list of VIPs -->
      <div class="lg:col-span-5 bg-slate-800/80 rounded-xl p-5 border border-slate-700 space-y-4">
        <h2 class="text-sm font-bold text-purple-400 uppercase tracking-wider flex items-center justify-between">
          <span><i class="fa-solid fa-list-ol mr-1.5"></i> 참석자 서열 순서 (1위~N위)</span>
          <button id="presetBtn" class="text-[11px] text-slate-400 hover:text-slate-200">기본 직급 채우기</button>
        </h2>
        <p class="text-[11px] text-slate-400">위에서부터 서열 1위(최고 상석), 2위, 3위 순으로 배치됩니다.</p>

        <div id="vipsContainer" class="space-y-2">
          <!-- Dynamic VIP inputs -->
        </div>

        <button id="addVipBtn" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-lg transition">
          + 참석자 추가
        </button>

        <div class="p-3 bg-slate-900 rounded-lg border border-slate-700/80 text-[11px] text-slate-400 space-y-1">
          <p class="font-bold text-amber-400"><i class="fa-solid fa-circle-info"></i> 정부 의전 기본 원칙</p>
          <p id="ruleText">
            • <b>차량 상석</b>: 운전기사가 있을 때 뒷좌석 우측(1위) → 뒷좌석 좌측(2위) → 조수석(3위) → 뒷좌석 중앙(4위)
          </p>
        </div>
      </div>

      <!-- Visual Stage / Canvas -->
      <div class="lg:col-span-7 bg-slate-800/80 rounded-xl p-5 border border-slate-700 flex flex-col items-center justify-center min-h-[420px]">
        <div id="canvasWrapper" class="w-full h-full flex items-center justify-center relative">
          <svg id="diagramSvg" viewBox="0 0 500 360" class="w-full max-w-[480px] h-auto drop-shadow-lg">
            <!-- Dynamic SVG content -->
          </svg>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="seating.js"></script>
</body>
</html>
