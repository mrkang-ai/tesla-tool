<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang-ko="보고서 쪽수 마술사 (분량 증폭·압축기) - TeslaTool" data-lang-en="Report Page Magic Adjuster - TeslaTool">보고서 쪽수 마술사 (분량 증폭·압축기) - TeslaTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#6366f1' } } } }
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <div id="header-placeholder"></div>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    <div class="mb-6 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-400 text-xs font-semibold uppercase tracking-wider mb-2 border border-indigo-500/20">
          <i class="fa-solid fa-file-lines"></i> CAT-02 / No.17
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold" data-lang-ko="📄 보고서 쪽수 마술사 (분량 증폭/압축)" data-lang-en="📄 Report Page Magic Adjuster">📄 보고서 쪽수 마술사 (분량 증폭/압축)</h1>
        <p class="text-slate-400 text-sm mt-1" data-lang-ko="HWP/워드 보고서의 '마지막 장 달랑 세 줄' 없애기! 만연체 수식어 증폭 vs 개조식 불릿 압축" data-lang-en="Eliminate the awkward 3-line spillover on the last page with auto-expander or bullet summarizer">
          HWP/워드 보고서의 '마지막 장 달랑 세 줄' 없애기! 만연체 수식어 증폭 vs 개조식 불릿 압축
        </p>
      </div>
      <div class="flex items-center gap-2">
        <button id="sampleBtn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg border border-slate-700">
          <i class="fa-solid fa-wand-magic-sparkles text-amber-400 mr-1"></i> 예문 넣기
        </button>
      </div>
    </div>

    <!-- Mode switch -->
    <div class="flex bg-slate-800 p-1.5 rounded-xl border border-slate-700 mb-6 max-w-md mx-auto">
      <button id="modeCompress" class="flex-1 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 bg-indigo-600 text-white">
        <i class="fa-solid fa-compress"></i> 분량 줄이기 (압축/다이어트)
      </button>
      <button id="modeExpand" class="flex-1 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 text-slate-400 hover:text-white">
        <i class="fa-solid fa-expand"></i> 분량 늘리기 (만연체 뻥튀기)
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Input Text -->
      <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 space-y-3 flex flex-col">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider">원본 텍스트 입력</h2>
          <span id="charCountIn" class="text-[11px] font-mono text-slate-400">0자 / 0단어</span>
        </div>
        <textarea id="inputText" class="w-full flex-1 min-h-[300px] bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs leading-relaxed text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="줄이고 싶거나 늘리고 싶은 보고서 문단을 입력하세요..."></textarea>
        
        <div class="flex gap-2">
          <button id="processBtn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg text-xs transition shadow-lg shadow-indigo-500/20">
            마술 실행하기 ✨
          </button>
        </div>
      </div>

      <!-- Result Text -->
      <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 space-y-3 flex flex-col">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-file-waveform"></i> 변환 결과
          </h2>
          <div class="flex items-center gap-2">
            <span id="charCountOut" class="text-[11px] font-mono text-indigo-300">0자</span>
            <span id="diffRate" class="text-[10px] px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-400 font-bold">0%</span>
          </div>
        </div>

        <div id="outputContainer" class="flex-1 min-h-[300px] bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs leading-relaxed text-slate-200 font-mono overflow-y-auto whitespace-pre-wrap">
결과가 여기에 표시됩니다.
        </div>

        <!-- HWP Tuning tips -->
        <div class="p-3 bg-slate-900/80 rounded-lg border border-slate-700/80 text-[11px] text-slate-400 space-y-1">
          <p class="font-bold text-slate-300 flex items-center gap-1">
            <i class="fa-solid fa-keyboard text-amber-400"></i> 한글(HWP) 단축키 팁
          </p>
          <p id="hwpTip">• 자간 줄이기: <kbd class="px-1 bg-slate-800 rounded border border-slate-600 text-slate-200">Alt + Shift + N</kbd> (1%씩 축소)</p>
        </div>

        <button id="copyOutBtn" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-white font-medium rounded-lg text-xs transition">
          <i class="fa-regular fa-copy mr-1"></i> 결과 텍스트 복사
        </button>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="adjuster.js"></script>
</body>
</html>
