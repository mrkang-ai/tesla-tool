<!DOCTYPE html>
<html class="light" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-ko="회의록 버즈워드 추출기 & 회의 불필요도 판독기 - 온라인 도구모음" data-lang-en="Meeting Buzzword Extractor - Online Toolkit">회의록 버즈워드 추출기 & 회의 불필요도 판독기 - 온라인 도구모음</title>
    <meta name="description" content="장황한 회의 텍스트에서 '싱크', '얼라인', '캐치업' 등 허세 버즈워드를 감지하고, 이 회의가 이메일 한 통으로 끝났을 확률을 판정합니다.">
    <link rel="canonical" href="https://tossgpt.online/meeting-buzzword/index.html">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0ea5e9",
                        "primary-hover": "#0284c7",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-200 min-h-screen flex flex-col">
    <div id="header-placeholder"></div>

    <main class="flex-1 max-w-[1100px] w-full mx-auto p-4 sm:p-8 flex flex-col gap-8">
        <div class="text-center flex flex-col items-center gap-2">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-100 dark:bg-purple-950/70 border border-purple-300 dark:border-purple-800 text-purple-700 dark:text-purple-300 text-xs font-bold">
                <span>💼 K-직장인 생존 키트</span>
                <span>•</span>
                <span>CAT-01 No.07</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white tracking-tight">
                회의록 버즈워드 추출기 & 회의 불필요도 판독기
            </h1>
            <p class="text-sm text-slate-600 dark:text-slate-400 max-w-xl">
                영혼 없는 2시간 회의에서 남은 것은 허세 영어 단어뿐! 회의 메모를 붙여넣으면 "이메일 한 통으로 끝났을 확률"과 진짜 액션 아이템을 추출합니다.
            </p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Left: Text Input & Sample Presets -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl flex flex-col gap-4">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-black text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
                        <span class="material-symbols-outlined text-primary text-base">notes</span>
                        <span>회의 메모 / 녹취록 텍스트</span>
                    </label>
                    <button id="sample-btn" class="text-xs text-primary font-bold hover:underline cursor-pointer">샘플 붙여넣기</button>
                </div>

                <textarea id="meeting-text" rows="10" class="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs leading-relaxed focus:ring-2 focus:ring-primary focus:outline-none" placeholder="회의 내용이나 메모를 여기에 붙여넣으세요...">오늘 미팅에서는 이번 Q3 아젠다를 중심으로 각 팀 R&R을 싱크 맞추는 작업을 진행했습니다. 김대리님이 가져오신 인사이트를 바탕으로 마케팅 퍼널을 딥다이브 해보니 고객 여정의 바운더리가 모호하다는 블락커가 발견되었습니다. 다음 주 킥오프 전까지 프로덕트팀과 캐치업하여 얼라인을 다시 맞추고, 비즈니스 밸류를 레버리지할 수 있는 피벗 플랜을 팔로업해 주시기 바랍니다.</textarea>

                <button id="analyze-btn" class="w-full py-3.5 rounded-2xl bg-primary hover:bg-primary-hover active:scale-95 text-white font-black text-xs sm:text-sm shadow-md shadow-sky-500/20 cursor-pointer flex items-center justify-center gap-2 transition-all">
                    <span class="material-symbols-outlined text-base">insights</span>
                    <span>회의 영혼 탈곡 분석 시작</span>
                </button>
            </div>

            <!-- Right: Results Dashboard -->
            <div class="flex flex-col gap-6">
                <!-- Gauge Card -->
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl flex flex-col items-center text-center gap-3">
                    <span class="text-xs font-bold text-slate-400">이 회의는 이메일 한 통으로 끝낼 수 있었을 확률</span>
                    <div id="email-prob" class="text-5xl sm:text-6xl font-black font-mono text-rose-500">
                        89%
                    </div>
                    <div id="email-verdict" class="text-xs font-bold text-slate-700 dark:text-slate-300 px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800">
                        🚨 "굳이 얼굴 보고 모여서 시간 낭비한 전형적인 회의"
                    </div>
                </div>

                <!-- Detected Buzzwords -->
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-xl flex flex-col gap-3">
                    <span class="text-xs font-bold text-slate-500">감지된 오피스 허세 버즈워드:</span>
                    <div id="buzzword-chips" class="flex flex-wrap gap-2">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Real Action Items -->
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-xl flex flex-col gap-3">
                    <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm">check_circle</span>
                        <span>실제 해야 할 일 3줄 요약 (Action Items)</span>
                    </span>
                    <ul id="action-items" class="text-xs text-slate-700 dark:text-slate-300 space-y-1.5 list-disc pl-4 leading-relaxed">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="../scripts/app.js" defer></script>
    <script src="../language.js" defer></script>
    <script src="buzzword.js"></script>
</body>
</html>
