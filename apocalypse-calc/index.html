<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인류 멸망 아포칼립스 생존 확률 계산기 | Apocalypse Survival Calculator - TossGPT</title>
  <meta name="description" content="좀비 바이러스 사태나 AI 반란 시 내 운동 능력과 식량 보유량으로 며칠이나 생존할 수 있을지 예측합니다.">
  <link rel="canonical" href="https://tossgpt.online/apocalypse-calc/index.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen flex flex-col font-sans">
  <div id="header"></div>
  <main class="flex-grow container mx-auto px-4 py-8 max-w-3xl">
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-950 text-red-300 border border-red-800 text-xs font-semibold mb-3">
        <i class="fa-solid fa-biohazard"></i>
        <span>SURVIVAL READINESS ASSESSMENT</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-black mb-2 text-amber-500">인류 멸망 아포칼립스 생존 계산기</h1>
      <p class="text-stone-400 text-sm">좀비 사태, 소행성 충돌, AI 반란 발생 시 당신의 생존 가능 일수를 산출합니다.</p>
    </div>

    <!-- Inputs -->
    <div class="bg-stone-900 border border-stone-800 rounded-2xl p-6 mb-6 space-y-4">
      <div>
        <label class="block text-xs font-bold text-stone-400 mb-1">재난 시나리오 선택</label>
        <select id="scenario" class="w-full p-2.5 bg-stone-950 border border-stone-700 rounded-lg text-white font-bold text-sm">
          <option value="zombie">부산행 스타일 전력질주 좀비 사태</option>
          <option value="ai">터미네이터 AI 킬러 로봇 반란</option>
          <option value="nuclear">핵전쟁 낙진 및 전력망 마비 (EMP)</option>
        </select>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-stone-400 mb-1">100m 달리기 기록</label>
          <select id="runningSpeed" class="w-full p-2.5 bg-stone-950 border border-stone-700 rounded-lg text-white font-bold text-sm">
            <option value="12">13초 미만 (육상 선수급)</option>
            <option value="15" selected>15~17초 (보통 성인)</option>
            <option value="20">20초 이상 (숨참)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-stone-400 mb-1">집안 비상식량 (라면/통조림)</label>
          <select id="foodStock" class="w-full p-2.5 bg-stone-950 border border-stone-700 rounded-lg text-white font-bold text-sm">
            <option value="3">3일치 미만 (배달의민족 의존)</option>
            <option value="14" selected>2주치 (비상 라면 보유)</option>
            <option value="60">2달 이상 (프레퍼족 생존 가방)</option>
          </select>
        </div>
      </div>

      <button id="calcBtn" class="w-full mt-2 py-3 bg-red-700 hover:bg-red-600 text-white font-black rounded-xl text-sm transition-all">
        생존 일수 및 생존율 계산하기
      </button>
    </div>

    <!-- Result -->
    <div id="resultBox" class="bg-stone-900 border-2 border-amber-600 rounded-2xl p-6 text-center shadow-xl">
      <div class="text-xs text-stone-400 font-bold uppercase tracking-wider">PREDICTED SURVIVAL TIME</div>
      <div id="daysCount" class="text-4xl sm:text-5xl font-black text-amber-400 my-2">18일 4시간</div>
      <div id="causeDeath" class="text-sm text-stone-300 mt-2">사망 원인: 3일차에 편의점 털러 나갔다가 좀비 무리에 포위됨.</div>
    </div>
  </main>
  <div id="footer"></div>

  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="apocalypse.js"></script>
</body>
</html>
