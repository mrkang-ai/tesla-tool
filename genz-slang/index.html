<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang-ko="Z세대·알파세대 슬랭 번역기 - TeslaTool" data-lang-en="Gen Z & Alpha Slang Translator - TeslaTool">Z세대·알파세대 슬랭 번역기 - TeslaTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#ec4899' } } } }
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <div id="header-placeholder"></div>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    <div class="mb-6 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-pink-500/10 text-pink-400 text-xs font-semibold uppercase tracking-wider mb-2 border border-pink-500/20">
          <i class="fa-solid fa-wand-magic"></i> CAT-03 / No.24
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold" data-lang-ko="🕶️ Z세대·알파세대 슬랭 밈 번역기" data-lang-en="🕶️ Gen Z & Alpha Slang Translator">🕶️ Z세대·알파세대 슬랭 밈 번역기</h1>
        <p class="text-slate-400 text-sm mt-1" data-lang-ko="Skibidi, Rizz, 중꺾마, 폼 미쳤다, 뇌절 등 꼰대어 ↔ 요즘 애들 신조어 완벽 상호 변환" data-lang-en="Translate between formal corporate boomer speak and trending Gen Z / Gen Alpha slang">
          Skibidi, Rizz, 중꺾마, 폼 미쳤다, 뇌절 등 꼰대어 ↔ 요즘 애들 신조어 완벽 상호 변환
        </p>
      </div>
      <div>
        <button id="swapModeBtn" class="px-3 py-1.5 bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs rounded-lg transition flex items-center gap-1.5">
          <i class="fa-solid fa-repeat"></i> 방향 전환
        </button>
      </div>
    </div>

    <!-- Direction Header -->
    <div class="text-center mb-4">
      <span id="directionLabel" class="inline-block px-4 py-1.5 bg-slate-800 text-pink-400 rounded-full text-xs font-bold border border-slate-700">
        표준어/꼰대어 ➔ Z세대 힙스터어
      </span>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
      <!-- Input Box -->
      <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 flex flex-col space-y-3">
        <label id="inputLabel" class="text-xs font-bold text-slate-300">입력 문장 (표준어)</label>
        <textarea id="inputText" class="flex-1 min-h-[220px] bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:ring-1 focus:ring-pink-500" placeholder="예: 오늘 우리 팀장님의 업무 역량은 정말 대단하고 매력적이었습니다."></textarea>
        
        <div class="flex flex-wrap gap-1.5 pt-2">
          <span class="text-[11px] text-slate-500">예시 단어:</span>
          <button class="badge-tag px-2 py-0.5 bg-slate-700 rounded text-[11px] text-slate-300 hover:bg-slate-600">완전 최고다</button>
          <button class="badge-tag px-2 py-0.5 bg-slate-700 rounded text-[11px] text-slate-300 hover:bg-slate-600">선 넘네</button>
          <button class="badge-tag px-2 py-0.5 bg-slate-700 rounded text-[11px] text-slate-300 hover:bg-slate-600">매력 쩐다</button>
        </div>
      </div>

      <!-- Output Box -->
      <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 flex flex-col space-y-3">
        <div class="flex justify-between items-center">
          <label id="outputLabel" class="text-xs font-bold text-pink-400">번역 결과 (Z세대/알파어)</label>
          <button id="copyBtn" class="text-[11px] text-slate-400 hover:text-white"><i class="fa-regular fa-copy mr-1"></i>복사</button>
        </div>
        <div id="outputText" class="flex-1 min-h-[220px] bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-pink-300 font-mono leading-relaxed whitespace-pre-wrap">
오늘 팀장님 폼 미쳤다... Rizz 폭발해서 극락 갔네 ㄷㄷ
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="slang.js"></script>
</body>
</html>
