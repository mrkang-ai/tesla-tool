<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang-ko="예비군·민방위 40세 만료 타임라인 캘린더 - TeslaTool" data-lang-en="Reserve & Civil Defense 40yo Exemption - TeslaTool">예비군·민방위 40세 만료 타임라인 캘린더 - TeslaTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#10b981' } } } }
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <div id="header-placeholder"></div>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    <div class="mb-6 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-semibold uppercase tracking-wider mb-2 border border-emerald-500/20">
          <i class="fa-solid fa-calendar-check"></i> CAT-04 / No.40
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold" data-lang-ko="📅 예비군·민방위 40세 종신 면제 캘린더" data-lang-en="📅 40yo Military Duty Exemption Calendar">📅 예비군·민방위 40세 종신 면제 캘린더</h1>
        <p class="text-slate-400 text-sm mt-1" data-lang-ko="동원지정(1~4년) → 기본/작계(5~6년) → 민방위 사이버 → 40세 만료 종신 해방 타임라인" data-lang-en="Complete lifecycle map until 40-year-old total discharge from all reserve and civil defense obligations">
          동원지정(1~4년) → 기본/작계(5~6년) → 민방위 사이버 → 40세 만료 종신 해방 타임라인
        </p>
      </div>
    </div>

    <!-- Inputs -->
    <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 mb-6 grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
      <div>
        <label class="block text-slate-300 mb-1 font-bold">출생 연도</label>
        <input type="number" id="birthYear" value="1998" min="1970" max="2008" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-bold text-emerald-400">
      </div>
      <div>
        <label class="block text-slate-300 mb-1 font-bold">전역 연도</label>
        <input type="number" id="dischargeYear" value="2020" min="1990" max="2030" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-bold text-slate-200">
      </div>
    </div>

    <!-- Timeline Steps -->
    <div class="bg-slate-800/80 rounded-2xl p-6 sm:p-8 border border-slate-700 space-y-6">
      <h2 class="text-sm font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-2">
        <i class="fa-solid fa-route"></i> 내 인생 국방 의무 타임라인
      </h2>

      <div id="timelineContainer" class="space-y-4">
        <!-- dynamic steps -->
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="calendar.js"></script>
</body>
</html>
