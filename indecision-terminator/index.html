<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결정장애 종결자: 3초 동전 던지기 & 룰렛 | Indecision Terminator - TossGPT</title>
  <meta name="description" content="동전이 공중에 떴을 때 당신이 진짜 원하던 답을 깨닫게 해주는 결정장애 치유 도구입니다.">
  <link rel="canonical" href="https://tossgpt.online/indecision-terminator/index.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes flip3d {
      0% { transform: rotateY(0deg) translateY(0); }
      50% { transform: rotateY(900deg) translateY(-120px); }
      100% { transform: rotateY(1800deg) translateY(0); }
    }
    .flipping {
      animation: flip3d 1.2s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-amber-50/40 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col">
  <div id="header"></div>
  <main class="flex-grow container mx-auto px-4 py-8 max-w-3xl flex flex-col items-center">
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 text-sm font-medium mb-3">
        <i class="fa-solid fa-coins"></i>
        <span data-lang-ko="선택 고민 3초 해결 도구" data-lang-en="3-Sec Decision Maker">선택 고민 3초 해결 도구</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-black mb-2" data-lang-ko="결정장애 종결자: 3초 동전 던지기" data-lang-en="Indecision Terminator: 3-Sec Coin Toss">결정장애 종결자: 3초 동전 던지기</h1>
      <p class="text-slate-600 dark:text-slate-400 text-sm" data-lang-ko="“동전이 공중에 떴을 때 마음속으로 빌었던 바로 그 쪽이 당신의 진짜 진심입니다.”" data-lang-en="“When the coin is in the air, you suddenly know what you're really hoping for.”">“동전이 공중에 떴을 때 마음속으로 빌었던 바로 그 쪽이 당신의 진짜 진심입니다.”</p>
    </div>

    <!-- Inputs for 2 Choices -->
    <div class="w-full bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-amber-200 dark:border-slate-700 p-6 mb-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-blue-600 dark:text-blue-400 mb-1">
            <i class="fa-solid fa-circle-dot mr-1"></i> <span data-lang-ko="선택 A (앞면)" data-lang-en="Choice A (Heads)">선택 A (앞면)</span>
          </label>
          <input type="text" id="choiceA" value="짜장면 먹기" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-900 font-bold text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-rose-600 dark:text-rose-400 mb-1">
            <i class="fa-solid fa-circle-dot mr-1"></i> <span data-lang-ko="선택 B (뒷면)" data-lang-en="Choice B (Tails)">선택 B (뒷면)</span>
          </label>
          <input type="text" id="choiceB" value="짬뽕 먹기" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-900 font-bold text-sm">
        </div>
      </div>
    </div>

    <!-- Coin Arena -->
    <div class="w-full bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 p-8 flex flex-col items-center justify-center min-h-[360px] relative">
      <div id="coinContainer" class="w-36 h-36 rounded-full bg-gradient-to-tr from-amber-400 via-yellow-300 to-amber-500 border-4 border-amber-600 shadow-xl flex items-center justify-center cursor-pointer transition-transform select-none">
        <span id="coinFace" class="text-2xl font-black text-amber-900 filter drop-shadow">앞면 A</span>
      </div>

      <button id="tossBtn" class="mt-8 px-8 py-3.5 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-white font-extrabold rounded-xl shadow-lg transition-all text-base flex items-center gap-2">
        <i class="fa-solid fa-hand-holding-dollar"></i>
        <span data-lang-ko="동전 힘차게 던지기 (스페이스바)" data-lang-en="Flip Coin (Spacebar)">동전 힘차게 던지기 (스페이스바)</span>
      </button>

      <!-- Revelation Message -->
      <div id="decisionResult" class="hidden mt-6 text-center">
        <div class="text-sm font-semibold text-slate-500" data-lang-ko="운명이 정해준 답" data-lang-en="Destiny's Choice">운명이 정해준 답</div>
        <div id="winningText" class="text-3xl font-black text-amber-600 dark:text-amber-400 my-2"></div>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-2 italic">
          💡 결과를 보고 "아... 다른 쪽이면 좋았는데" 싶었나요? 그렇다면 망설이지 말고 반대쪽을 고르세요!
        </p>
      </div>
    </div>
  </main>
  <div id="footer"></div>

  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="terminator.js"></script>
</body>
</html>
