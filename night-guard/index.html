<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang-ko="불침번·당직 공평무사 난수 추첨기 - TeslaTool" data-lang-en="Fair Night Guard Shift Allocator - TeslaTool">불침번·당직 공평무사 난수 추첨기 - TeslaTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#6366f1' } } } }
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <div id="header-placeholder"></div>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    <div class="mb-6 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-400 text-xs font-semibold uppercase tracking-wider mb-2 border border-indigo-500/20">
          <i class="fa-solid fa-moon"></i> CAT-04 / No.34
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold" data-lang-ko="🌙 불침번 & 당직 공평무사 난수 추첨기" data-lang-en="🌙 Fair Night Guard Shift Allocator">🌙 불침번 & 당직 공평무사 난수 추첨기</h1>
        <p class="text-slate-400 text-sm mt-1" data-lang-ko="새벽 02:00~04:00 헬 타임 불만을 종식시키는 암호학적 난수(CSPRNG) 공평 근무표 생성기" data-lang-en="Cryptographic RNG shift generator to fairly allocate dreadful 2AM-4AM night watch hours">
          새벽 02:00~04:00 헬 타임 불만을 종식시키는 암호학적 난수(CSPRNG) 공평 근무표 생성기
        </p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- Left Config -->
      <div class="lg:col-span-5 bg-slate-800/80 rounded-xl p-5 border border-slate-700 space-y-4">
        <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider flex items-center gap-1.5">
          <i class="fa-solid fa-users"></i> 생활관 근무 대상 인원 (줄바꿈 구분)
        </h2>

        <textarea id="guardMembers" rows="7" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs leading-relaxed text-slate-200 font-mono focus:outline-none focus:ring-1 focus:ring-indigo-500">김병장
이수석
박상병
최일병
정일병
강이병
윤이병
조이병</textarea>

        <button id="drawShiftBtn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg text-xs transition shadow-lg shadow-indigo-500/20">
          공평무사 난수 추첨 실행 🎲
        </button>
      </div>

      <!-- Right Shift Table -->
      <div class="lg:col-span-7 bg-slate-800/80 rounded-xl p-5 border border-slate-700 flex flex-col space-y-3">
        <div class="flex justify-between items-center pb-2 border-b border-slate-700">
          <span class="text-xs font-bold text-slate-300">오늘 밤 불침번 순번표</span>
          <button id="copyShiftBtn" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-xs rounded text-slate-200">
            근무표 복사
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-900 text-slate-400 border-b border-slate-700">
              <tr>
                <th class="py-2 px-3">초번/순번</th>
                <th class="py-2 px-3">근무 시간대</th>
                <th class="py-2 px-3">당첨자 (사수/부사수)</th>
                <th class="py-2 px-3 text-right">피로도</th>
              </tr>
            </thead>
            <tbody id="shiftTbody" class="divide-y divide-slate-700/60 font-mono">
              <!-- shifts -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="guard.js"></script>
</body>
</html>
