<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang-ko="군용 모스 부호 번역기 & 비퍼 - TeslaTool" data-lang-en="Military Morse Code Beeper - TeslaTool">군용 모스 부호 번역기 & 비퍼 - TeslaTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#10b981' } } } }
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <div id="header-placeholder"></div>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    <div class="mb-6 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-semibold uppercase tracking-wider mb-2 border border-emerald-500/20">
          <i class="fa-solid fa-tower-broadcast"></i> CAT-04 / No.35
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold" data-lang-ko="📻 군용 모스 부호 번역기 & 오디오 비퍼" data-lang-en="📻 Morse Code Translator & Audio Beeper">📻 군용 모스 부호 번역기 & 오디오 비퍼</h1>
        <p class="text-slate-400 text-sm mt-1" data-lang-ko="텍스트 ↔ 모스 부호 양방향 변환 및 800Hz 표준 통신 비프음 & 플래시 램프 점멸 시뮬레이터" data-lang-en="Translate text to military Morse code with 800Hz sound beeps and visual flash lamps">
          텍스트 ↔ 모스 부호 양방향 변환 및 800Hz 표준 통신 비프음 & 플래시 램프 점멸 시뮬레이터
        </p>
      </div>
      <div>
        <button id="playMorseBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold text-xs rounded-xl transition flex items-center gap-2 shadow-lg shadow-emerald-600/30">
          <i class="fa-solid fa-volume-high"></i> 모스 부호 비프음 재생 (삐- 삐-)
        </button>
      </div>
    </div>

    <!-- Flash Lamp Simulator -->
    <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 mb-6 flex items-center justify-center gap-4">
      <div id="lamp" class="w-12 h-12 rounded-full bg-slate-900 border-2 border-slate-700 transition-all duration-75 flex items-center justify-center text-xs font-bold text-slate-500">
        OFF
      </div>
      <span class="text-xs text-slate-400 font-mono">전술 조명 신호등 (Signal Flash Lamp)</span>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
      <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 space-y-3 flex flex-col">
        <label class="text-xs font-bold text-slate-300">텍스트 입력 (영문 / 숫자 / SOS)</label>
        <textarea id="morseInput" class="flex-1 min-h-[220px] bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 font-mono focus:outline-none focus:ring-1 focus:ring-emerald-500" placeholder="예: SOS WE NEED BACKUP"></textarea>
      </div>

      <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 space-y-3 flex flex-col">
        <div class="flex justify-between items-center">
          <label class="text-xs font-bold text-emerald-400">모스 부호 (Morse Code)</label>
          <button id="copyMorseBtn" class="text-[11px] text-slate-400 hover:text-white"><i class="fa-regular fa-copy mr-1"></i>복사</button>
        </div>
        <div id="morseOutput" class="flex-1 min-h-[220px] bg-slate-900 border border-slate-700 rounded-lg p-3 text-base text-emerald-300 font-mono tracking-widest leading-relaxed overflow-y-auto whitespace-pre-wrap">
... --- ...
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="morse.js"></script>
</body>
</html>
