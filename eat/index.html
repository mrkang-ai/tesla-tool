<!DOCTYPE html>
<html class="light" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-ko="오늘 뭐 먹지? - 온라인 도구모음" data-lang-en="What to Eat Today? - Online Toolkit">오늘 뭐 먹지? - 온라인 도구모음</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="오늘 점심, 저녁 메뉴가 고민될 때 버튼 하나로 메뉴를 추천받으세요. 다양한 음식 이미지와 함께 메뉴 선택의 어려움을 덜어드립니다." data-lang-ko="오늘 점심, 저녁 메뉴가 고민될 때 버튼 하나로 메뉴를 추천받으세요. 다양한 음식 이미지와 함께 메뉴 선택의 어려움을 덜어드립니다." data-lang-en="When you're wondering what to have for lunch or dinner today, get a menu recommendation with the click of a button. We'll help you choose a menu with a variety of food images.">
    <link rel="canonical" href="https://tossgpt.online/eat/index.html">
    <meta property="og:title" content="오늘 뭐 먹지?" data-lang-ko="오늘 뭐 먹지?" data-lang-en="What to Eat Today?">
    <meta property="og:description" content="버튼 하나로 오늘 먹을 메뉴를 추천받으세요." data-lang-ko="버튼 하나로 오늘 먹을 메뉴를 추천받으세요." data-lang-en="Get a recommendation for today's menu with the click of a button.">

    <!-- New Design Scripts and Links -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0ea5e9",
                        "primary-hover": "#0284c7",
                        "background-light": "#f0f9ff",
                        "background-dark": "#0f172a",
                        "text-main": "#0f172a",
                        "text-muted": "#64748b",
                        "card-bg-light": "#ffffff",
                        "card-bg-dark": "#1e293b",
                        "accent-light": "#e0f2fe",
                        "accent-dark": "#1e293b",

<body class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden text-text-main dark:text-[#f0f9ff]">

    <div id="header-placeholder"></div>

    <main class="px-4 md:px-10 lg:px-16 flex flex-1 justify-center py-5">
        <div class="layout-content-container flex flex-col max-w-[1200px] flex-1 items-center mx-auto">
            <div class="max-w-xl w-full mx-auto text-center">
                <header class="py-8">
                    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-text-main dark:text-white block whitespace-nowrap" data-lang-ko="🍲 오늘 뭐 먹지?" data-lang-en="🍲 What to Eat Today?">🍲 오늘 뭐 먹지?</h1>
                    <p class="mt-3 text-sm sm:text-md text-text-muted dark:text-slate-400 block" data-lang-ko="결정 장애 해결! 버튼을 눌러 오늘 먹을 최적의 메뉴를 추천받으세요." data-lang-en="Get the perfect menu recommendation for today with a single click!">결정 장애 해결! 버튼을 눌러 오늘 먹을 최적의 메뉴를 추천받으세요.</p>
                </header>

                <button id="recommend-btn" class="w-full flex items-center justify-center rounded-2xl h-16 px-6 bg-primary text-white text-xl font-extrabold hover:bg-primary-hover shadow-lg hover:shadow-sky-100 dark:hover:shadow-none transition-all active:scale-95">
                    <span data-lang-ko="🍽️ 메뉴 추천받기" data-lang-en="🍽️ Recommend a Menu!">🍽️ 메뉴 추천받기</span>
                </button>
                
                <div id="loading-animation" class="hidden mt-8">
                    <p class="text-lg font-bold text-text-muted dark:text-slate-400 animate-pulse" data-lang-ko="🍽️ 맛있는 메뉴 탐색중..." data-lang-en="🍽️ Searching for delicious menu...">🍽️ 맛있는 메뉴 탐색중...</p>
                    <div id="image-spinner" class="mt-4"></div>
                </div>
            </div> <!-- CLOSE the max-w-xl container early -->

            <!-- SECTION 1-2: Recommended Result Card (Full Width max-w-[1200px]) -->
            <div id="result" class="hidden mt-8 w-full bg-card-bg-light dark:bg-card-bg-dark p-0 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-800/80 overflow-hidden text-left">
                <div class="grid grid-cols-1 md:grid-cols-12">
                    <!-- Image Container (Col 6) - Giant photo for strong visual impact -->
                    <div class="md:col-span-6 relative h-80 md:h-[480px]">
                        <img id="result-image" src="" alt="추천 메뉴" class="w-full h-full object-cover">
                        <span id="result-category" class="absolute top-5 left-5 bg-primary text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-md">한식</span>
                    </div>
                    <!-- Info Container (Col 6) - Premium spacing -->
                    <div class="md:col-span-6 p-6 md:p-10 flex flex-col justify-between">
                        <div>
                            <span class="text-[11px] font-extrabold text-primary tracking-widest uppercase bg-sky-50 dark:bg-sky-950/40 px-2.5 py-1.5 rounded-md" data-lang-ko="오늘의 추천 메뉴" data-lang-en="TODAY'S CHOICE">오늘의 추천 메뉴</span>
                            <h3 id="result-name" class="mt-4 text-4xl font-black text-text-main dark:text-white leading-tight"></h3>
                            <p id="result-description" class="mt-4 text-[15px] text-text-muted dark:text-slate-400 leading-relaxed font-medium italic"></p>
                        </div>
                        
                        <!-- Add to Planner section -->
                        <div id="add-to-planner-sec" class="mt-6 pt-6 border-t border-slate-100 dark:border-slate-800/80 flex flex-col gap-3">
                            <p class="text-xs font-bold text-text-muted dark:text-slate-400" data-lang-ko="📋 이 메뉴를 일주일 식단표에 추가하기" data-lang-en="📋 Add this menu to the Weekly Planner">📋 이 메뉴를 일주일 식단표에 추가하기</p>
                            <div class="flex flex-wrap items-center gap-2">
                                <select id="select-day" class="h-10 px-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-semibold text-text-main dark:text-white focus:outline-none focus:ring-2 focus:ring-primary">
                                    <option value="mon" data-lang-ko="월요일" data-lang-en="Monday">월요일</option>
                                    <option value="tue" data-lang-ko="화요일" data-lang-en="Tuesday">화요일</option>
                                    <option value="wed" data-lang-ko="수요일" data-lang-en="Wednesday">수요일</option>
                                    <option value="thu" data-lang-ko="목요일" data-lang-en="Thursday">목요일</option>
                                    <option value="fri" data-lang-ko="금요일" data-lang-en="Friday">금요일</option>
                                    <option value="sat" data-lang-ko="토요일" data-lang-en="Saturday">토요일</option>
                                    <option value="sun" data-lang-ko="일요일" data-lang-en="Sunday">일요일</option>
                                </select>
                                <select id="select-meal" class="h-10 px-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-semibold text-text-main dark:text-white focus:outline-none focus:ring-2 focus:ring-primary">
                                    <option value="lunch" data-lang-ko="점심 식사" data-lang-en="Lunch">점심 식사</option>
                                    <option value="dinner" data-lang-ko="저녁 식사" data-lang-en="Dinner">저녁 식사</option>
                                </select>
                                <button id="add-to-planner-btn" class="h-10 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white text-sm font-bold shadow-md hover:shadow-emerald-100 dark:hover:shadow-none transition-all flex items-center gap-1">
                                    <span class="material-symbols-outlined text-base">add_circle</span>
                                    <span data-lang-ko="식단에 추가" data-lang-en="Add to Plan">식단에 추가</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECTION 2: Weekly Meal Planner (max-w-[1200px] w-full) inside a Collapsible Card (hidden by default) -->
            <section id="planner-section" class="hidden w-full mt-16 border border-slate-200/60 dark:border-slate-800 bg-slate-50/30 dark:bg-slate-900/10 rounded-2xl overflow-hidden transition-all duration-300 shadow-sm">
                <!-- Accordion Header Toggle -->
                <button id="planner-toggle-btn" class="w-full flex items-center justify-between p-6 bg-white dark:bg-slate-800/60 hover:bg-slate-50 dark:hover:bg-slate-800 text-left border-none focus:outline-none transition-colors cursor-pointer select-none">
                    <div class="flex items-center gap-4">
                        <span class="text-3xl">📅</span>
                        <div>
                            <h2 class="text-xl font-extrabold text-text-main dark:text-white" data-lang-ko="나의 일주일 식단표" data-lang-en="My Weekly Meal Planner">나의 일주일 식단표</h2>
                            <p class="text-xs text-text-muted dark:text-slate-400 mt-1" data-lang-ko="클릭해서 열고 나만의 주간 식단을 채워보세요!" data-lang-en="Click to expand and plan your weekly meals!">클릭해서 열고 나만의 주간 식단을 채워보세요!</p>
                        </div>
                    </div>
                    <span id="planner-chevron" class="material-symbols-outlined text-2xl text-text-muted transition-transform duration-300">expand_more</span>
                </button>

                <!-- Expanded Content Area (starts folded/hidden) -->
                <div id="planner-content" class="hidden p-6 border-t border-slate-100 dark:border-slate-800/80">
                    <p class="text-sm text-text-muted dark:text-slate-400 text-center mb-6" data-lang-ko="오늘 추천받은 메뉴로 식단표를 구성해 보세요. 카드를 드래그하거나 탭하여 식단 순서를 변경할 수 있습니다." data-lang-en="Build your weekly menu with recommended dishes. Drag or click cards to swap their positions.">오늘 추천받은 메뉴로 식단표를 구성해 보세요. 카드를 드래그하거나 탭하여 식단 순서를 변경할 수 있습니다.</p>

                    <div class="flex flex-wrap justify-center gap-4 mb-8">
                        <button id="auto-fill-btn" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-sm font-bold rounded-xl shadow-md hover:shadow-indigo-100 dark:hover:shadow-none transition-all flex items-center gap-1.5">
                            <span class="material-symbols-outlined text-lg">auto_awesome</span>
                            <span data-lang-ko="식단 전체 자동 구성" data-lang-en="Auto-Generate Week">식단 전체 자동 구성</span>
                        </button>
                        <button id="download-txt-btn" class="px-5 py-2.5 bg-sky-600 hover:bg-sky-700 active:scale-95 text-white text-sm font-bold rounded-xl shadow-md hover:shadow-sky-100 dark:hover:shadow-none transition-all flex items-center gap-1.5">
                            <span class="material-symbols-outlined text-lg">download</span>
                            <span data-lang-ko="텍스트 다운로드" data-lang-en="Download TXT">텍스트 다운로드</span>
                        </button>
                        <button id="download-png-btn" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-sm font-bold rounded-xl shadow-md hover:shadow-emerald-100 dark:hover:shadow-none transition-all flex items-center gap-1.5">
                            <span class="material-symbols-outlined text-lg">image</span>
                            <span data-lang-ko="이미지 다운로드" data-lang-en="Download PNG">이미지 다운로드</span>
                        </button>
                        <button id="clear-planner-btn" class="px-5 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-950/30 dark:hover:text-red-400 text-text-main dark:text-white text-sm font-semibold rounded-xl border border-slate-200/60 dark:border-slate-800 active:scale-95 transition-all flex items-center gap-1.5">
                            <span class="material-symbols-outlined text-lg">delete_sweep</span>
                            <span data-lang-ko="식단표 전체 초기화" data-lang-en="Reset Planner">식단표 전체 초기화</span>
                        </button>
                    </div>

                    <!-- Planner Grid (7 Columns representing Mon - Sun) -->
                    <div id="planner-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-7 gap-4 w-full">
                        <!-- Day Columns will be dynamically generated by JS -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div id="footer-placeholder"></div>
