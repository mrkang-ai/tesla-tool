<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang-ko="군대 짬밥 탈주율 & PX 냉동 폭풍 지수 - TeslaTool" data-lang-en="Barracks Meal & PX Run Predictor - TeslaTool">군대 짬밥 탈주율 & PX 냉동 폭풍 지수 - TeslaTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#f97316' } } } }
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <div id="header-placeholder"></div>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    <div class="mb-6 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-500/10 text-orange-400 text-xs font-semibold uppercase tracking-wider mb-2 border border-orange-500/20">
          <i class="fa-solid fa-utensils"></i> CAT-04 / No.33
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold" data-lang-ko="🍲 군대 짬밥 탈주율 & PX 냉동 폭풍 지수" data-lang-en="🍲 Barracks Meal & PX Run Predictor">🍲 군대 짬밥 탈주율 & PX 냉동 폭풍 지수</h1>
        <p class="text-slate-400 text-sm mt-1" data-lang-ko="조순튀, 해빔소, 똥국 등장 시 식당 탈주율(%) 및 PX 슈넬치킨·불닭 만두 완판 확률 예측" data-lang-en="Predict dining hall escape rates & PX frozen food rushes based on infamous military menu items">
          조순튀, 해빔소, 똥국 등장 시 식당 탈주율(%) 및 PX 슈넬치킨·불닭 만두 완판 확률 예측
        </p>
      </div>
      <div>
        <span id="alertBadge" class="px-3 py-1 bg-rose-500/20 text-rose-300 border border-rose-500/30 rounded-full text-xs font-bold font-mono">
          PX 대폭발 경보 발령
        </span>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- Menu selector -->
      <div class="lg:col-span-5 bg-slate-800/80 rounded-xl p-5 border border-slate-700 space-y-4">
        <h2 class="text-xs font-bold text-orange-400 uppercase tracking-wider flex items-center gap-1.5">
          <i class="fa-solid fa-clipboard-list"></i> 오늘 식단 메뉴 선택 (다중 선택)
        </h2>

        <div id="menuItemsList" class="space-y-2 text-xs">
          <!-- populated via JS -->
        </div>

        <button id="predictBtn" class="w-full py-2.5 bg-orange-600 hover:bg-orange-500 text-slate-950 font-bold rounded-lg text-xs transition shadow-lg shadow-orange-500/20">
          탈주율 및 PX 폭풍 지수 계산 🏃💨
        </button>
      </div>

      <!-- Predict result -->
      <div class="lg:col-span-7 space-y-4">
        <div class="bg-slate-800/80 rounded-xl p-6 border border-slate-700 text-center">
          <span class="text-xs text-slate-400 uppercase font-bold">식당 식수 탈주율</span>
          <div id="escapeRateDisplay" class="text-5xl sm:text-6xl font-black font-mono text-rose-400 my-2">
            87%
          </div>
          <p id="escapeComment" class="text-xs text-slate-300">
            🚨 <b>"조순튀 + 해빔소 더블 콤보"</b> 발생! 식당은 텅 비고 PX 전자레인지 대기 시간 25분 돌파!
          </p>
        </div>

        <!-- PX Recommended Rescue Cart -->
        <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 space-y-3">
          <h3 class="text-xs font-bold text-yellow-300 uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-cart-shopping"></i> PX 생존 냉동 & 라면 비상 조합 추천
          </h3>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 text-xs">
            <div class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-center">
              <span class="text-lg block">🍗</span>
              <span class="font-bold text-slate-200 block mt-1">슈넬치킨</span>
              <span class="text-[10px] text-slate-400">전자레인지 3분 30초</span>
            </div>
            <div class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-center">
              <span class="text-lg block">🥟</span>
              <span class="font-bold text-slate-200 block mt-1">고향만두 + 참치</span>
              <span class="text-[10px] text-slate-400">간장 살짝 + 참기름</span>
            </div>
            <div class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-center">
              <span class="text-lg block">🍜</span>
              <span class="font-bold text-slate-200 block mt-1">간짬뽕 + 공화춘</span>
              <span class="text-[10px] text-slate-400">간화춘 전설의 레시피</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="meal.js"></script>
</body>
</html>
