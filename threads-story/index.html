<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang-ko="스레드(Threads) 특유의 줄글 바이럴 생성기 - TeslaTool" data-lang-en="Threads Viral Storyteller - TeslaTool">스레드(Threads) 특유의 줄글 바이럴 생성기 - TeslaTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#64748b' } } } }
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <div id="header-placeholder"></div>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    <div class="mb-6 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-500/10 text-slate-400 text-xs font-semibold uppercase tracking-wider mb-2 border border-slate-500/20">
          <i class="fa-brands fa-threads"></i> CAT-05 / No.43
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold" data-lang-ko="🧵 스레드(Threads) 바이럴 스토리텔러" data-lang-en="🧵 Threads Viral Storyteller">🧵 스레드(Threads) 바이럴 스토리텔러</h1>
        <p class="text-slate-400 text-sm mt-1" data-lang-ko="'오늘 아침 지하철에서 문득 든 생각...', 끊임없는 엔터 줄바꿈과 자기성찰형 스레드체 변환" data-lang-en="Transform mundane thoughts into viral Threads-style storytelling with characteristic line-breaks">
          '오늘 아침 지하철에서 문득 든 생각...', 끊임없는 엔터 줄바꿈과 자기성찰형 스레드체 변환
        </p>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
      <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 flex flex-col space-y-3">
        <label class="text-xs font-bold text-slate-300">내 평범한 생각 한 줄</label>
        <textarea id="threadIn" class="flex-1 min-h-[220px] bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:ring-1 focus:ring-slate-500" placeholder="예: 오늘 회사 부장님이랑 밥 먹었는데 너무 피곤했다."></textarea>
        <button id="convertThreadBtn" class="w-full py-2.5 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-lg text-xs transition">
          스레드 감성체로 변환하기 🧵
        </button>
      </div>

      <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 flex flex-col space-y-3">
        <div class="flex justify-between items-center pb-2 border-b border-slate-700">
          <span class="text-xs font-bold text-slate-300 font-mono">스레드 피드 포스팅</span>
          <button id="copyThreadBtn" class="text-xs px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded">복사</button>
        </div>
        <div id="threadOut" class="flex-1 min-h-[220px] bg-slate-900 rounded-lg p-3 text-xs leading-relaxed text-slate-200 overflow-y-auto whitespace-pre-wrap border border-slate-700/80">
결과가 여기에 표시됩니다.
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="threads.js"></script>
</body>
</html>
