<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang-ko="비주얼 정규표현식(Regex) 샌드박스 - TeslaTool" data-lang-en="Visual Regex Sandbox - TeslaTool">비주얼 정규표현식(Regex) 샌드박스 - TeslaTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#eab308' } } } }
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <div id="header-placeholder"></div>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    <div class="mb-6 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-yellow-500/10 text-yellow-400 text-xs font-semibold uppercase tracking-wider mb-2 border border-yellow-500/20">
          <i class="fa-solid fa-code-fork"></i> CAT-06 / No.59
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold" data-lang-ko="🔍 비주얼 정규표현식(Regex) 샌드박스" data-lang-en="🔍 Visual Regex Sandbox">🔍 비주얼 정규표현식(Regex) 샌드박스</h1>
        <p class="text-slate-400 text-sm mt-1" data-lang-ko="정규식 입력 시 실시간 매칭 노란색 형광펜 하이라이트 & 한국어 문법 친절 해설" data-lang-en="Live regex testing with instant visual highlight and friendly syntax breakdown">
          정규식 입력 시 실시간 매칭 노란색 형광펜 하이라이트 & 한국어 문법 친절 해설
        </p>
      </div>
    </div>

    <!-- Regex Input -->
    <div class="bg-slate-800/80 rounded-2xl p-5 border border-slate-700 space-y-4 mb-6">
      <div class="flex items-center gap-2 font-mono">
        <span class="text-lg text-yellow-400 font-bold">/</span>
        <input type="text" id="regexPattern" value="[0-9]{3}-[0-9]{4}-[0-9]{4}" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-yellow-300 focus:outline-none focus:ring-1 focus:ring-yellow-500">
        <span class="text-lg text-yellow-400 font-bold">/</span>
        <input type="text" id="regexFlags" value="g" class="w-16 bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-sm text-center text-slate-300">
      </div>
    </div>

    <!-- Test String & Visual Output -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
      <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 space-y-2 flex flex-col">
        <label class="text-xs font-bold text-slate-300">테스트할 원본 문자열</label>
        <textarea id="testString" class="flex-1 min-h-[220px] bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs font-mono text-slate-200 focus:outline-none focus:ring-1 focus:ring-yellow-500">문의 사항은 고객센터 010-1234-5678 또는 02-987-6543, 010-8888-9999로 연락주세요.</textarea>
      </div>

      <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 space-y-2 flex flex-col">
        <div class="flex justify-between items-center pb-2 border-b border-slate-700">
          <span class="text-xs font-bold text-yellow-400 font-mono">매칭 하이라이트</span>
          <span id="matchCount" class="text-xs font-mono text-slate-400">2개 일치</span>
        </div>
        <div id="highlightBox" class="flex-1 min-h-[220px] bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs font-mono text-slate-300 leading-relaxed overflow-y-auto whitespace-pre-wrap"></div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="regex.js"></script>
</body>
</html>
