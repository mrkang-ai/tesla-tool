<body class="bg-slate-50 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-200 min-h-screen flex flex-col">
    <div id="header-placeholder"></div>

    <main class="flex-1 max-w-[1100px] w-full mx-auto p-4 sm:p-8 flex flex-col gap-8">
        <div class="text-center flex flex-col items-center gap-2">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold">
                <span>🏛️ 공무원 & 행정 & 민원 마스터</span>
                <span>•</span>
                <span>CAT-02 No.11</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white tracking-tight">
                공문서 행정체 번역기
            </h1>
            <p class="text-sm text-slate-600 dark:text-slate-400 max-w-xl">
                "그거 예산 없어서 안 됩니다"를 "가용 재원 종합 검토 결과 수용 곤란함을 회신하오니..."로 변환! 6하원칙 개조식 정통 공문서 양식으로 즉시 변환합니다.
            </p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Left: Input -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl flex flex-col gap-5">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-500">전달하려는 핵심 용건 (일상어):</span>
                    <button id="sample-btn" class="text-xs font-bold text-primary hover:underline cursor-pointer">샘플 불러오기</button>
                </div>

                <textarea id="raw-text" rows="6" class="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs leading-relaxed focus:ring-2 focus:ring-primary focus:outline-none" placeholder="공문서로 만들고 싶은 용건을 자유롭게 적으세요...">이번 사업은 작년 대비 예산이 전액 삭감되어 추가 지원이 어렵습니다. 기존 매뉴얼대로 자체 처리하시기 바라며 다음 주 금요일까지 결과 보고서 보내주세요.</textarea>

                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-slate-600 dark:text-slate-400">공문서 유형 선택</label>
                    <div class="grid grid-cols-3 gap-2 text-xs font-bold" id="doc-type-group">
                        <button class="doc-type-btn active py-2 rounded-xl bg-primary text-white cursor-pointer" data-type="reject">수용불가 / 반려</button>
                        <button class="doc-type-btn py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 cursor-pointer" data-type="request">제출 요청 / 독촉</button>
                        <button class="doc-type-btn py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 cursor-pointer" data-type="notice">일반 안내 / 협조</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div>
                        <label class="font-bold text-slate-500 block mb-1">발신 부서명</label>
                        <input type="text" id="dept-name" value="기획조정실 정책기획과" class="w-full p-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold text-xs">
                    </div>
                    <div>
                        <label class="font-bold text-slate-500 block mb-1">수신처</label>
                        <input type="text" id="target-org" value="수신처 참조 (각 과 및 산하기관)" class="w-full p-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold text-xs">
                    </div>
                </div>

                <button id="convert-btn" class="w-full py-3.5 rounded-2xl bg-primary hover:bg-primary-hover active:scale-95 text-white font-black text-xs sm:text-sm shadow-md shadow-sky-500/20 cursor-pointer transition-all">
                    공문서 행정체 변환하기

            <!-- Right: Official Document Preview -->

                <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                    <span class="text-xs font-black text-slate-900 dark:text-white flex items-center gap-1.5">
                        <span class="material-symbols-outlined text-emerald-500 text-base">description</span>
                        <span>행정안전부 정부 공문서 표준 서식</span>
                    </span>
                    <button id="copy-doc-btn" class="px-3 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-primary hover:text-white text-xs font-bold transition-all flex items-center gap-1 cursor-pointer">
                        <span class="material-symbols-outlined text-sm">content_copy</span>
                        <span id="copy-doc-text">공문 복사</span>
                    </button>
                </div>

                <!-- Document Body Container -->
                <div id="official-doc-view" class="p-6 rounded-2xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-xs leading-relaxed text-slate-800 dark:text-slate-200 font-mono whitespace-pre-wrap select-text">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="../scripts/app.js" defer></script>
    <script src="../language.js" defer></script>

</html>
