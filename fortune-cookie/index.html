<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바삭한 디지털 포춘쿠키 & 현실 조언기 | Digital Fortune Cookie - TossGPT</title>
  <meta name="description" content="포춘쿠키를 쪼개면 바삭 소리와 함께 위트 있고 뼈 때리는 현실 조언이 출력됩니다.">
  <link rel="canonical" href="https://tossgpt.online/fortune-cookie/index.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes crackBounce {
      0% { transform: scale(1); }
      50% { transform: scale(0.92) rotate(-5deg); }
      100% { transform: scale(1); }
    }
    .animate-crack {
      animation: crackBounce 0.3s ease-in-out;
    }
  </style>
</head>
<body class="bg-amber-50/50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col">
  <div id="header"></div>
  <main class="flex-grow container mx-auto px-4 py-10 max-w-3xl flex flex-col items-center">
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 text-sm font-medium mb-3">
        <i class="fa-solid fa-cookie-bite"></i>
        <span data-lang-ko="디지털 포춘쿠키" data-lang-en="Digital Fortune Cookie">디지털 포춘쿠키</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-black mb-2" data-lang-ko="바삭한 현실 조언 포춘쿠키" data-lang-en="Crispy Real-Life Fortune Cookie">바삭한 현실 조언 포춘쿠키</h1>
      <p class="text-slate-600 dark:text-slate-400" data-lang-ko="쿠키를 터치해 반으로 쪼개보세요. 오늘 당신에게 꼭 필요한 팩트폭행과 행운의 숫자가 나옵니다." data-lang-en="Crack the cookie to reveal realistic fortune advice & lucky numbers.">쿠키를 터치해 반으로 쪼개보세요. 오늘 당신에게 꼭 필요한 팩트폭행과 행운의 숫자가 나옵니다.</p>
    </div>

    <!-- Cookie Container -->
    <div class="w-full bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-amber-200 dark:border-slate-700 p-8 flex flex-col items-center justify-center min-h-[380px] relative overflow-hidden">
      <!-- Cookie Visual -->
      <div id="cookieBtn" class="cursor-pointer group flex flex-col items-center transition-transform hover:scale-105 active:scale-95 select-none">
        <div id="cookieIcon" class="text-8xl md:text-9xl text-amber-500 filter drop-shadow-lg transition-transform">
          🥠
        </div>
        <p id="clickPrompt" class="mt-4 font-bold text-amber-800 dark:text-amber-300 animate-pulse text-sm">
          <i class="fa-solid fa-hand-pointer mr-1"></i> <span data-lang-ko="쿠키를 톡 눌러 쪼개기" data-lang-en="Tap cookie to crack open">쿠키를 톡 눌러 쪼개기</span>
        </p>
      </div>

      <!-- Cracked Paper (Hidden Initially) -->
      <div id="paperBox" class="hidden mt-6 w-full max-w-lg bg-amber-50 dark:bg-amber-950/40 border-2 border-dashed border-amber-400 dark:border-amber-600 rounded-2xl p-6 shadow-md text-center transform transition-all duration-500">
        <div class="text-xs uppercase tracking-widest text-amber-700 dark:text-amber-400 font-bold mb-2 flex items-center justify-center gap-1">
          <i class="fa-solid fa-sparkles"></i> <span>TODAY'S FORTUNE</span> <i class="fa-solid fa-sparkles"></i>
        </div>
        <p id="fortuneText" class="text-lg md:text-xl font-black text-slate-800 dark:text-amber-100 leading-relaxed my-3"></p>
        <div class="border-t border-amber-200 dark:border-amber-800/60 pt-3 mt-4 flex items-center justify-around text-xs font-semibold text-amber-800 dark:text-amber-300">
          <div><i class="fa-solid fa-clover mr-1"></i> <span data-lang-ko="행운의 숫자" data-lang-en="Lucky Numbers">행운의 숫자</span>: <span id="luckyNums" class="font-mono text-rose-600 dark:text-rose-400"></span></div>
          <div><i class="fa-solid fa-palette mr-1"></i> <span data-lang-ko="행운의 색" data-lang-en="Lucky Color">행운의 색</span>: <span id="luckyColor"></span></div>
        </div>
      </div>

      <button id="resetBtn" class="hidden mt-6 px-5 py-2 rounded-xl bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold text-sm hover:bg-slate-300 transition-colors">
        <i class="fa-solid fa-rotate-right mr-1"></i> <span data-lang-ko="다른 쿠키 쪼개기" data-lang-en="Crack Another Cookie">다른 쿠키 쪼개기</span>
      </button>
    </div>
  </main>
  <div id="footer"></div>

  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="cookie.js"></script>
</body>
</html>
