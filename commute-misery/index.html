<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang-ko="대학생 통학 고통 지수 계산기 - TeslaTool" data-lang-en="Commute Misery Index - TeslaTool">대학생 통학 고통 지수 계산기 - TeslaTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#64748b' } } } }
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <div id="header-placeholder"></div>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    <div class="mb-6 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-500/10 text-slate-400 text-xs font-semibold uppercase tracking-wider mb-2 border border-slate-500/20">
          <i class="fa-solid fa-train-subway"></i> CAT-03 / No.29
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold" data-lang-ko="🚇 대학생 통학 고통 지수 계산기" data-lang-en="🚇 Commute Misery Index">🚇 대학생 통학 고통 지수 계산기</h1>
        <p class="text-slate-400 text-sm mt-1" data-lang-ko="왕복 통학 시간, 지옥철 환승 횟수로 산출하는 '길바닥에 버린 시간' & 자취 vs 통학 손익분기점" data-lang-en="Calculate wasted hours on public transit and see the financial breakeven for campus studio rentals">
          왕복 통학 시간, 지옥철 환승 횟수로 산출하는 '길바닥에 버린 시간' & 자취 vs 통학 손익분기점
        </p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- Input Left -->
      <div class="lg:col-span-5 bg-slate-800/80 rounded-xl p-5 border border-slate-700 space-y-4">
        <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider">통학 코스 정보</h2>

        <div>
          <label class="block text-xs text-slate-300 mb-1">편도 소요 시간 (분)</label>
          <input type="number" id="oneWayMin" value="95" min="10" max="240" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono font-bold text-amber-300">
          <span class="text-[11px] text-slate-500">왕복 190분 (약 3.1시간)</span>
        </div>

        <div>
          <label class="block text-xs text-slate-300 mb-1">주당 등교 일수</label>
          <select id="daysPerWeek" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs">
            <option value="5">주 5일 (헬)</option>
            <option value="4" selected>주 4일 (보통)</option>
            <option value="3">주 3일 (시간표 장인)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-300 mb-1">이용 노선 특성</label>
          <select id="lineDifficulty" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs">
            <option value="1.5">지옥철 9호선 급행 / 신도림 2호선 (압사 공포)</option>
            <option value="1.3">광역버스 입석 금지 / 빨간버스 대기</option>
            <option value="1.0" selected>일반 지하철 / 버스 (앉아서 갈 확률 반반)</option>
            <option value="0.7">기점 탑승으로 100% 착석</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-300 mb-1">환승 횟수 (편도)</label>
          <input type="number" id="transfers" value="2" min="0" max="5" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs">
        </div>

        <button id="calcCommuteBtn" class="w-full py-2.5 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-lg text-xs transition">
          고통 지수 계산 📊
        </button>
      </div>

      <!-- Result Right -->
      <div class="lg:col-span-7 space-y-4">
        <div class="bg-slate-800/80 rounded-xl p-6 border border-slate-700 text-center">
          <span class="text-xs text-slate-400 uppercase font-bold">1학기(16주) 동안 길바닥에 버린 시간</span>
          <div id="wastedHours" class="text-5xl font-black font-mono text-rose-400 my-2">
            202 시간
          </div>
          <p id="wastedDesc" class="text-xs text-slate-300">
            ✈️ 유럽 왕복 비행기 10번 탈 시간이며, 토익 900점을 완성하고도 남을 시간입니다.
          </p>
        </div>

        <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 space-y-3 text-xs">
          <h3 class="font-bold text-amber-400">🏡 자취 vs 통학 가성비 분석</h3>
          <p id="rentAdvice" class="text-slate-300 leading-relaxed">
            월세 50만 원 vs 길바닥에서 잃어버리는 생명력 40점. 당신의 시급 환산 가치를 감안하면 학교 앞 원룸 계약이 이득일 수 있습니다.
          </p>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="commute.js"></script>
</body>
</html>
