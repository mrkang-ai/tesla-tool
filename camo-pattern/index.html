<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang-ko="전술 위장(Camo) 패턴 캔버스 생성기 - TeslaTool" data-lang-en="Tactical Camo Pattern Generator - TeslaTool">전술 위장(Camo) 패턴 캔버스 생성기 - TeslaTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#15803d' } } } }
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <div id="header-placeholder"></div>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    <div class="mb-6 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-green-600/10 text-green-400 text-xs font-semibold uppercase tracking-wider mb-2 border border-green-600/20">
          <i class="fa-solid fa-palette"></i> CAT-04 / No.38
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold" data-lang-ko="🎨 전술 위장(Camo) 패턴 캔버스 생성기" data-lang-en="🎨 Tactical Camo Pattern Generator">🎨 전술 위장(Camo) 패턴 캔버스 생성기</h1>
        <p class="text-slate-400 text-sm mt-1" data-lang-ko="대한민국 국군 디지털 화강암 패턴, 클래식 우드랜드, 멀티캠, 사막 위장 무한 절차적 생성 & 다운로드" data-lang-en="Generate procedural tactical camouflage patterns for Korean digital granite, classic woodland, and multicam">
          대한민국 국군 디지털 화강암 패턴, 클래식 우드랜드, 멀티캠, 사막 위장 무한 절차적 생성 & 다운로드
        </p>
      </div>
      <div>
        <button id="downloadPngBtn" class="px-4 py-2 bg-green-700 hover:bg-green-600 text-white font-bold text-xs rounded-xl transition flex items-center gap-2 shadow-lg">
          <i class="fa-solid fa-download"></i> 배경화면(PNG) 다운로드
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- Config -->
      <div class="lg:col-span-4 bg-slate-800/80 rounded-xl p-5 border border-slate-700 space-y-4">
        <h2 class="text-xs font-bold text-green-400 uppercase tracking-wider">위장 패턴 스타일</h2>

        <div>
          <label class="block text-xs text-slate-300 mb-1">군용 패턴 종류</label>
          <select id="camoType" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs">
            <option value="digital">한국군 디지털 픽셀 화강암</option>
            <option value="woodland">클래식 개구리복 (우드랜드)</option>
            <option value="desert">사막 기동군 (데저트 삼색)</option>
            <option value="navy">해군 블루 워터 픽셀</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-300 mb-1">패턴 밀도 / 스케일</label>
          <input type="range" id="camoScale" min="8" max="40" value="16" class="w-full accent-green-600">
        </div>

        <button id="randomizeBtn" class="w-full py-2.5 bg-green-600 hover:bg-green-500 text-white font-bold rounded-lg text-xs transition shadow-lg shadow-green-600/20">
          새로운 위장 패턴 생성 (Re-roll) 🎲
        </button>
      </div>

      <!-- Canvas Area -->
      <div class="lg:col-span-8 bg-slate-800/80 rounded-xl p-4 border border-slate-700 flex items-center justify-center">
        <canvas id="camoCanvas" width="600" height="400" class="w-full h-auto max-w-[600px] rounded-lg shadow-2xl border border-slate-700"></canvas>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="camo.js"></script>
</body>
</html>
