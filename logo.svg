<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="toolboxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#toolboxGrad)" filter="url(#glow)" />
  <!-- Inner Highlight -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />
  
