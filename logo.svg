  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Handle -->
    <path d="M200 130 V100 A24 24 0 0 1 224 76 H288 A24 24 0 0 1 312 100 V130" />
    <!-- Lid Top -->
    <path d="M130 144 H382" />
    <!-- Lid Body -->
    <path d="M110 230 V174 A24 24 0 0 1 134 150 H378 A24 24 0 0 1 402 174 V230" />
    <!-- Horizontal Divider Latches -->
    <path d="M100 230 H412" />
    <!-- Bottom Chest -->
    <path d="M110 230 V350 A32 32 0 0 0 142 382 H370 A32 32 0 0 0 402 350 V230" />
    <!-- Center Clasp Latch -->
    <rect x="228" y="214" width="56" height="44" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="12" />
