<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang-ko="유튜브 어그로 썸네일 제목 생성기 - TeslaTool" data-lang-en="YouTube Clickbait Title Generator - TeslaTool">유튜브 어그로 썸네일 제목 생성기 - TeslaTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#ef4444' } } } }
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <div id="header-placeholder"></div>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    <div class="mb-6 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-rose-500/10 text-rose-400 text-xs font-semibold uppercase tracking-wider mb-2 border border-rose-500/20">
          <i class="fa-brands fa-youtube"></i> CAT-05 / No.42
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold" data-lang-ko="💥 유튜브 알고리즘 폭격 어그로 제목기" data-lang-en="💥 YouTube Clickbait Title Generator">💥 유튜브 알고리즘 폭격 어그로 제목기</h1>
        <p class="text-slate-400 text-sm mt-1" data-lang-ko="[충격], 결국 터졌습니다, 안 보면 100% 후회... 클릭률(CTR) 300% 폭발 제목 8종 세트" data-lang-en="Generate viral, high-CTR YouTube video titles that algorithmically hook viewers">
          [충격], 결국 터졌습니다, 안 보면 100% 후회... 클릭률(CTR) 300% 폭발 제목 8종 세트
        </p>
      </div>
    </div>

    <div class="bg-slate-800/80 rounded-2xl p-6 border border-slate-700 space-y-4 mb-6">
      <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">
        내 영상의 핵심 주제 키워드
      </label>
      <div class="flex gap-2">
        <input type="text" id="topicInput" value="개발자 퇴사" placeholder="예: 인공지능 주식, 다이어트 식단, 아이폰17" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500">
        <button id="genTitlesBtn" class="px-6 py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-xl transition shadow-lg shadow-rose-600/30">
          어그로 제목 폭격 🚀
        </button>
      </div>
    </div>

    <!-- Output Cards -->
    <div id="titlesGrid" class="space-y-3">
      <!-- 8 Clickbait Titles populated by JS -->
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="clickbait.js"></script>
</body>
</html>
