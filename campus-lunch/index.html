<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang-ko="캠퍼스 학식 잔고 연동 점심 룰렛 - TeslaTool" data-lang-en="Campus Lunch Budget Roulette - TeslaTool">캠퍼스 학식 잔고 연동 점심 룰렛 - TeslaTool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#f97316' } } } }
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <div id="header-placeholder"></div>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    <div class="mb-6 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-500/10 text-orange-400 text-xs font-semibold uppercase tracking-wider mb-2 border border-orange-500/20">
          <i class="fa-solid fa-utensils"></i> CAT-03 / No.28
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold" data-lang-ko="🍱 캠퍼스 지갑 잔고 연동 점심 룰렛" data-lang-en="🍱 Campus Lunch Budget Roulette">🍱 캠퍼스 지갑 잔고 연동 점심 룰렛</h1>
        <p class="text-slate-400 text-sm mt-1" data-lang-ko="통장 잔고 3,800원부터 15,000원까지 맞춤형 메뉴(편의점 vs 학식 vs 후문 맛집) 룰렛 추천" data-lang-en="Match current bank balance with convenience store, student cafeteria, or campus restaurants">
          통장 잔고 3,800원부터 15,000원까지 맞춤형 메뉴(편의점 vs 학식 vs 후문 맛집) 룰렛 추천
        </p>
      </div>
    </div>

    <!-- Balance Selector -->
    <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700 mb-6 flex flex-wrap items-center justify-between gap-4">
      <div>
        <label class="block text-xs text-slate-400 mb-1 font-semibold">내 통장 점심 가용 잔액</label>
        <div class="flex items-center gap-2">
          <input type="number" id="balanceInput" value="6500" step="500" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono font-bold text-orange-300 w-36">
          <span class="text-xs text-slate-400">원</span>
        </div>
      </div>
      <div class="flex gap-2">
        <button class="qb-btn px-2.5 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs text-slate-300" data-val="3500">3,500원 (빈곤)</button>
        <button class="qb-btn px-2.5 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs text-slate-300" data-val="6500">6,500원 (보통)</button>
        <button class="qb-btn px-2.5 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs text-slate-300" data-val="12000">12,000원 (부르주아)</button>
      </div>
    </div>

    <!-- Roulette Card -->
    <div class="bg-slate-800/80 rounded-2xl p-6 sm:p-8 border border-slate-700 text-center space-y-6 shadow-2xl">
      <div class="relative w-48 h-48 mx-auto flex items-center justify-center">
        <div id="rouletteWheel" class="w-full h-full rounded-full border-4 border-orange-500/50 bg-gradient-to-tr from-slate-800 to-slate-900 flex items-center justify-center text-4xl shadow-inner transition-transform duration-1000">
          🍲
        </div>
      </div>

      <div>
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">오늘의 낙점 메뉴</span>
        <div id="selectedMenuName" class="text-2xl sm:text-3xl font-black text-orange-400 mt-1">
          학식 치즈 돈까스
        </div>
        <p id="selectedMenuDesc" class="text-xs text-slate-300 mt-1">
          예상 가격: ₩6,000 / 학생회관 2층 / 잔액 방어율 92%
        </p>
      </div>

      <button id="spinBtn" class="px-8 py-3 bg-orange-600 hover:bg-orange-500 text-slate-950 font-black rounded-xl text-sm transition shadow-lg shadow-orange-500/30">
        룰렛 돌리기 🎲
      </button>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../scripts/app.js"></script>
  <script src="../language.js"></script>
  <script src="lunch.js"></script>
</body>
</html>
